# YOLO11n detection at strides 4, 8, and 16 for VisDrone small objects.
# Derived from the pinned Ultralytics YOLO11 architecture (AGPL-3.0).
# Backbone P5 remains as context; only its detection output is replaced by P2.
nc: 10
scale: n
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0 P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1 P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 P2
  - [-1, 1, Conv, [256, 3, 2]] # 3 P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 P3
  - [-1, 1, Conv, [512, 3, 2]] # 5 P4/16
  - [-1, 2, C3k2, [512, True]] # 6 P4
  - [-1, 1, Conv, [1024, 3, 2]] # 7 P5/32
  - [-1, 2, C3k2, [1024, True]] # 8 P5
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 fuse P4 backbone
  - [-1, 2, C3k2, [512, False]] # 13 P4 top-down

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 fuse P3 backbone
  - [-1, 2, C3k2, [256, False]] # 16 P3 top-down

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18 fuse P2 backbone
  - [-1, 2, C3k2, [128, False]] # 19 P2/4 detection feature

  - [-1, 1, Conv, [128, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21 fuse P3 top-down
  - [-1, 2, C3k2, [256, False]] # 22 P3/8 detection feature

  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24 fuse P4 top-down
  - [-1, 2, C3k2, [512, False]] # 25 P4/16 detection feature

  - [[19, 22, 25], 1, Detect, [nc]] # 26 Detect(P2, P3, P4)
